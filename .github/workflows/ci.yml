name: CI acadêmica

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Validar coerência acadêmica
        run: npm run validate:project

      - name: Verificar TypeScript
        run: npm run lint

      - name: Build de produção
        run: npm run build
